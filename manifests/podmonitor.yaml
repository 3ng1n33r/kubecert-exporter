---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kubecert-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: kubecert-exporter
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15m
